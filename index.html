<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage Dashboard</title>
<style>
:root {
  --bg:#0f1115; --card:#171a21; --border:#262b36; --text:#e6e9ef; --dim:#8b93a3;
  --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; --purple:#bc8cff; --cyan:#39c5cf; --pink:#f778ba;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:24px; }
h1 { font-size:18px; margin-bottom:4px; }
.sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
.modebar { display:flex; align-items:center; gap:8px; margin:-8px 0 18px; color:var(--dim); font-size:11px; }
.modebar button { background:var(--card); border:1px solid var(--border); border-radius:6px; color:var(--dim); cursor:pointer; font:inherit; padding:5px 9px; }
.modebar button.active { border-color:var(--blue); color:var(--text); }
.modebar button:disabled { cursor:not-allowed; opacity:.45; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
.card h2 { font-size:14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.card h2 .acct { color:var(--dim); font-size:11px; font-weight:normal; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
.card h2 .src { font-size:10px; color:var(--dim); border:1px solid var(--border); border-radius:10px; padding:1px 6px; }
.badge { font-size:11px; padding:2px 8px; border-radius:20px; }
.badge.ok { background:rgba(63,185,80,.15); color:var(--green); }
.badge.err { background:rgba(248,81,73,.15); color:var(--red); }
.row { margin-bottom:14px; }
.row:last-child { margin-bottom:0; }
.row .top { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
.row .top .label { color:var(--dim); }
.row .top .pct { font-weight:bold; }
.bar { height:8px; border-radius:4px; background:#262b36; overflow:hidden; }
.bar > div { height:100%; border-radius:4px; transition:width .5s ease; }
.spark { height:32px; margin-top:6px; opacity:.95; }
.spark svg { width:100%; height:100%; display:block; overflow:visible; }
.reset { color:var(--dim); font-size:11px; margin-top:4px; }
.resetbank { color:var(--dim); font-size:11px; margin:6px 0 2px; }
.resetbank .rb { color:var(--green); font-weight:600; }
details.pool summary { list-style:none; cursor:pointer; }
details.pool summary::-webkit-details-marker { display:none; }
details.pool .chev { color:var(--dim); font-size:10px; transition:transform .2s; display:inline-block; margin-left:6px; }
details.pool[open] .chev { transform:rotate(90deg); }
.mlist { margin-top:6px; max-height:180px; overflow-y:auto; border-left:1px solid var(--border); padding-left:8px; }
.mlist li { display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--dim); padding:2px 0; list-style:none; }
.mlist li .mpct { color:var(--text); font-weight:bold; }
.row.unknown .top .pct { color:var(--dim); font-weight:normal; }
.errbox { color:var(--red); font-size:12px; padding:8px; background:rgba(248,81,73,.08); border-radius:6px; }
.plan { font-size:11px; color:var(--dim); }
footer { margin-top:20px; color:var(--dim); font-size:11px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<h1>AI Usage Dashboard</h1>
<div class="sub" id="sub">loading...</div>
<div class="modebar" aria-label="Claude usage mode">
  <span>Claude:</span>
  <button type="button" data-mode="direct" onclick="setClaudeMode('direct')" title="Reads the Claude credentials file directly. Only the generic 5-hour / 7-day windows — no per-model rows (Fable), no reset bank.">Direct · 1 account</button>
  <button type="button" data-mode="multi" onclick="setClaudeMode('multi')" title="Reads usage via claude-swap. Shows all accounts plus per-model rows (e.g. Fable (7-day)).">Multi-account · cswap</button>
</div>
<div class="grid" id="grid"></div>
<footer>
  <span id="collected"></span>
  <span>auto-refresh 60s</span>
</footer>

<script>
const STATUS = {
  "z.ai":          { icon:"⚡", color:"var(--purple)" },
  "opencode-go":   { icon:"🏃", color:"var(--cyan)" },
  "claude":        { icon:"✳️", color:"var(--amber)" },
  "codex":         { icon:"🟠", color:"var(--blue)" },
  "antigravity":   { icon:"🪐", color:"var(--green)" },
  "muse":          { icon:"♾️", color:"var(--pink)" },
};

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
}

function colorFor(pct) {
  if (pct >= 90) return "var(--red)";
  if (pct >= 70) return "var(--amber)";
  return "var(--green)";
}

function countdown(resetsAt, now) {
  if (!resetsAt) return "";
  const diff = Math.max(0, resetsAt - now);
  const d = Math.floor(diff / 86400);
  const h = Math.floor((diff % 86400) / 3600);
  const m = Math.floor((diff % 3600) / 60);
  if (d > 0) return `resets in ${d}d ${h}h`;
  if (h > 0) return `resets in ${h}h ${m}m`;
  return `resets in ${m}m`;
}

function fmtTime(resetsAt, now) {
  if (!resetsAt) return "";
  const local = new Date(resetsAt * 1000);
  return local.toLocaleString("en-GB", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Asia/Bangkok" });
}

let HISTORY = {}; // key "provider|label" -> [used_percent...]

function sparkline(key, color) {
  const pts = HISTORY[key];
  if (!pts || pts.length < 1) return "";
  const w = 100, h = 32;
  const max = 100;
  const gradId = `g_${key.split("|").join("_").replace(/[^a-zA-Z0-9_]/g, "_")}`;
  if (pts.length === 1) {
    const ly = (h - (pts[0] / max) * h).toFixed(1);
    const x = (w / 2).toFixed(1);
    const area = `0,${h} ${x},${ly} ${w},${h}`;
    return `<div class="spark"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0.05"/>
        </linearGradient>
      </defs>
      <polygon points="${area}" fill="url(#${gradId})" />
      <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="${color}" stroke-opacity="0.22"/>
      <polyline points="0,${ly} ${x},${ly} ${w},${ly}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
      <circle cx="${x}" cy="${ly}" r="2.4" fill="${color}"/>
    </svg></div>`;
  }
  const step = w / (pts.length - 1);
  const coords = pts.map((v, i) => `${(i * step).toFixed(1)},${(h - (v / max) * h).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1];
  const lx = ((pts.length - 1) * step).toFixed(1);
  const ly = (h - (last / max) * h).toFixed(1);
  const area = `0,${h} ${coords} ${w},${h}`;
  return `<div class="spark"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.05"/>
      </linearGradient>
    </defs>
    <polygon points="${area}" fill="url(#${gradId})" />
    <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="${color}" stroke-opacity="0.22"/>
    <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.4" fill="${color}"/>
  </svg></div>`;
}

function limitRow(lim, now, provider, account, source) {
  const key = `${provider}|${source || ""}|${account || ""}|${lim.label || "limit"}`;
  const models = lim.models || [];

  if (lim.unknown) {
    return `
      <div class="row unknown">
        <div class="top">
          <span class="label" title="${esc(models.join(", "))}">${esc(lim.label || "no quota data")}</span>
          <span class="pct">unknown</span>
        </div>
        <details class="pool">
          <summary><span style="font-size:11px;color:var(--dim)">show models<span class="chev">▸</span></span></summary>
          <ul class="mlist">${models.map(m => `<li><span>${esc(m)}</span></li>`).join("")}</ul>
        </details>
      </div>`;
  }

  const pct = Math.round(lim.used_percent || 0);
  const color = colorFor(pct);
  const rowHtml = (extra) => `
      <div class="top">
        <span class="label">${esc(lim.label || "limit")}${extra ? '<span class="chev">▸</span>' : ""}</span>
        <span class="pct" style="color:${color}">${pct}%</span>
      </div>
      <div class="bar"><div style="width:${pct}%; background:${color}"></div></div>
      ${sparkline(key, color)}
      <div class="reset">${countdown(lim.resets_at, now)}${lim.resets_at ? ` &middot; resets ${fmtTime(lim.resets_at, now)} GMT+7` : ""}</div>`;

  if (models.length > 1) {
    return `
      <details class="row pool">
        <summary>${rowHtml(true)}</summary>
        <ul class="mlist">${models.map(m => `<li><span>${esc(m)}</span><span class="mpct">${pct}%</span></li>`).join("")}</ul>
      </details>`;
  }
  return `<div class="row">${rowHtml(false)}</div>`;
}

function resetBankHtml(r) {
  if (!r) return "";
  let what = "";
  if (Array.isArray(r.groups) && r.groups.length) {
    const parts = r.groups.map(g => {
      const exp = g.expires_at ? ` · expires ${esc(String(g.expires_at).slice(0, 10))}` : "";
      return `<span class="rb">${g.count}×${esc(g.label)}</span>${exp}`;
    });
    return `<div class="resetbank">🔄 Reset bank: ${parts.join(" + ")}</div>`;
  }
  if (r.five_hour !== undefined || r.weekly !== undefined) {
    const parts = [];
    if (r.five_hour) parts.push(`${r.five_hour}×5-hour`);
    if (r.weekly) parts.push(`${r.weekly}×weekly`);
    if (!parts.length) return "";
    what = parts.join(" + ");
  } else if (r.count) {
    what = `${r.count}×`;
  } else {
    return "";
  }
  const title = r.title ? ` · ${esc(r.title)}` : "";
  const exp = r.expires_at ? ` · expires ${esc(String(r.expires_at).slice(0, 10))}` : "";
  return `<div class="resetbank">🔄 Reset bank: <span class="rb">${what}</span>${title}${exp}</div>`;
}

function render(data) {
  const now = Math.floor(Date.now() / 1000);
  document.getElementById("collected").textContent = `collected ${new Date(data.ts * 1000).toLocaleTimeString("en-GB")}`;

  const grid = document.getElementById("grid");
  grid.innerHTML = data.providers.map(p => {
    const meta = STATUS[p.provider] || { icon:"🔷", color:"var(--blue)" };
    const badge = p.status === "ok"
      ? `<span class="badge ok">ok</span>`
      : `<span class="badge err">error</span>`;
    const plan = p.plan ? `<span class="plan">${esc(p.plan)}</span>` : "";
    const account = p.account ? `<span class="acct" title="${esc(p.account)}">· ${esc(p.account)}</span>` : "";
    const source = p.source ? `<span class="src">${esc(p.source)}${p.active ? " · active" : ""}</span>` : "";
    const body = p.status === "ok" && p.limits && p.limits.length
      ? p.limits.map(l => limitRow(l, now, p.provider, p.account, p.source)).join("")
      : `<div class="errbox">${esc(p.error || "no data")}</div>`;
    return `
      <div class="card">
        <h2>${meta.icon} ${esc(p.provider)} ${account} ${source} ${plan} ${badge}</h2>
        ${body}
        ${resetBankHtml(p.resets)}
      </div>`;
  }).join("");
  document.querySelectorAll(".modebar button").forEach(button => {
    button.classList.toggle("active", button.dataset.mode === data.claude_mode);
    button.disabled = button.dataset.mode === "multi" && !data.claude_multi_available;
    button.setAttribute("aria-pressed", button.dataset.mode === data.claude_mode);
  });
}

async function setClaudeMode(mode) {
  document.querySelectorAll(".modebar button").forEach(button => button.disabled = true);
  document.getElementById("sub").textContent = `loading Claude ${mode} mode...`;
  try {
    const res = await fetch("claude/mode", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mode}),
      cache:"no-store",
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || `HTTP ${res.status}`);
    await load();
  } catch (e) {
    document.getElementById("sub").textContent = `⚠ Claude mode change failed: ${e.message}`;
    await load();
  }
}

async function loadHistory() {
  try {
    const res = await fetch("history.json", { cache: "no-store" });
    const arr = await res.json();
    const map = {};
    for (const snap of arr) {
      for (const p of (snap.providers || [])) {
        for (const l of (p.limits || [])) {
          const k = `${p.provider}|${p.source || ""}|${p.account || ""}|${l.label}`;
          (map[k] = map[k] || []).push(l.used_percent);
        }
      }
    }
    HISTORY = map;
  } catch (e) { /* ignore */ }
}

async function load() {
  try {
    await loadHistory();
    const res = await fetch("data.json", { cache: "no-store" });
    const data = await res.json();
    document.getElementById("sub").textContent = data.any_error ? "⚠ some providers failed" : "all providers ok";
    render(data);
  } catch (e) {
    document.getElementById("sub").textContent = "⚠ cannot load data.json — backend not running? start with ./ctl.sh start";
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
