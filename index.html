<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage Dashboard</title>
<style>
:root {
  --bg:#0f1115; --card:#171a21; --border:#262b36; --text:#e6e9ef; --dim:#8b93a3;
  --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; --purple:#bc8cff;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:24px; }
h1 { font-size:18px; margin-bottom:4px; }
.sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
.card h2 { font-size:14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
.badge { font-size:11px; padding:2px 8px; border-radius:20px; }
.badge.ok { background:rgba(63,185,80,.15); color:var(--green); }
.badge.err { background:rgba(248,81,73,.15); color:var(--red); }
.row { margin-bottom:14px; }
.row:last-child { margin-bottom:0; }
.row .top { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
.row .top .label { color:var(--dim); }
.row .top .pct { font-weight:bold; }
.bar { height:8px; border-radius:4px; background:#262b36; overflow:hidden; }
.bar > div { height:100%; border-radius:4px; transition:width .5s ease; }
.spark { height:32px; margin-top:6px; opacity:.95; }
.spark svg { width:100%; height:100%; display:block; overflow:visible; }
.reset { color:var(--dim); font-size:11px; margin-top:4px; }
.errbox { color:var(--red); font-size:12px; padding:8px; background:rgba(248,81,73,.08); border-radius:6px; }
.plan { font-size:11px; color:var(--dim); }
footer { margin-top:20px; color:var(--dim); font-size:11px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<h1>AI Usage Dashboard</h1>
<div class="sub" id="sub">loading...</div>
<div class="grid" id="grid"></div>
<footer>
  <span id="collected"></span>
  <span>auto-refresh 60s</span>
</footer>

<script>
const STATUS = {
  "z.ai":      { icon:"⚡", color:"var(--purple)" },
  "claude":    { icon:"✳️", color:"var(--amber)" },
  "codex":     { icon:"🟠", color:"var(--blue)" },
};

function colorFor(pct) {
  if (pct >= 90) return "var(--red)";
  if (pct >= 70) return "var(--amber)";
  return "var(--green)";
}

function countdown(resetsAt, now) {
  if (!resetsAt) return "";
  const diff = Math.max(0, resetsAt - now);
  const d = Math.floor(diff / 86400);
  const h = Math.floor((diff % 86400) / 3600);
  const m = Math.floor((diff % 3600) / 60);
  if (d > 0) return `resets in ${d}d ${h}h`;
  if (h > 0) return `resets in ${h}h ${m}m`;
  return `resets in ${m}m`;
}

function fmtTime(resetsAt, now) {
  if (!resetsAt) return "";
  const local = new Date(resetsAt * 1000);
  return local.toLocaleString("en-GB", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Asia/Bangkok" });
}

let HISTORY = {}; // key "provider|label" -> [used_percent...]

function sparkline(key, color) {
  const pts = HISTORY[key];
  if (!pts || pts.length < 1) return "";
  const w = 100, h = 32;
  const max = 100;
  const gradId = `g_${key.split("|").join("_").replace(/[^a-zA-Z0-9_]/g, "_")}`;
  if (pts.length === 1) {
    const ly = (h - (pts[0] / max) * h).toFixed(1);
    const x = (w / 2).toFixed(1);
    const area = `0,${h} ${x},${ly} ${w},${h}`;
    return `<div class="spark"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0.05"/>
        </linearGradient>
      </defs>
      <polygon points="${area}" fill="url(#${gradId})" />
      <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="${color}" stroke-opacity="0.22"/>
      <polyline points="0,${ly} ${x},${ly} ${w},${ly}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
      <circle cx="${x}" cy="${ly}" r="2.4" fill="${color}"/>
    </svg></div>`;
  }
  const step = w / (pts.length - 1);
  const coords = pts.map((v, i) => `${(i * step).toFixed(1)},${(h - (v / max) * h).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1];
  const lx = ((pts.length - 1) * step).toFixed(1);
  const ly = (h - (last / max) * h).toFixed(1);
  const area = `0,${h} ${coords} ${w},${h}`;
  return `<div class="spark"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.05"/>
      </linearGradient>
    </defs>
    <polygon points="${area}" fill="url(#${gradId})" />
    <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="${color}" stroke-opacity="0.22"/>
    <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.4" fill="${color}"/>
  </svg></div>`;
}

function limitRow(lim, now, provider) {
  const pct = Math.round(lim.used_percent || 0);
  const color = colorFor(pct);
  const key = `${provider}|${lim.label || "limit"}`;
  return `
    <div class="row">
      <div class="top">
        <span class="label">${lim.label || "limit"}</span>
        <span class="pct" style="color:${color}">${pct}%</span>
      </div>
      <div class="bar"><div style="width:${pct}%; background:${color}"></div></div>
      ${sparkline(key, color)}
      <div class="reset">${countdown(lim.resets_at, now)}${lim.resets_at ? ` &middot; resets ${fmtTime(lim.resets_at, now)} GMT+7` : ""}</div>
    </div>`;
}

function render(data) {
  const now = Math.floor(Date.now() / 1000);
  document.getElementById("collected").textContent = `collected ${new Date(data.ts * 1000).toLocaleTimeString("en-GB")}`;

  const grid = document.getElementById("grid");
  grid.innerHTML = data.providers.map(p => {
    const meta = STATUS[p.provider] || { icon:"🔷", color:"var(--blue)" };
    const badge = p.status === "ok"
      ? `<span class="badge ok">ok</span>`
      : `<span class="badge err">error</span>`;
    const plan = p.plan ? `<span class="plan">${p.plan}</span>` : "";
    const body = p.status === "ok" && p.limits && p.limits.length
      ? p.limits.map(l => limitRow(l, now, p.provider)).join("")
      : `<div class="errbox">no data</div>`;
    return `
      <div class="card">
        <h2>${meta.icon} ${p.provider} ${plan} ${badge}</h2>
        ${body}
      </div>`;
  }).join("");
}

async function loadHistory() {
  try {
    const res = await fetch("history.json", { cache: "no-store" });
    const arr = await res.json();
    const map = {};
    for (const snap of arr) {
      for (const p of (snap.providers || [])) {
        for (const l of (p.limits || [])) {
          const k = `${p.provider}|${l.label}`;
          (map[k] = map[k] || []).push(l.used_percent);
        }
      }
    }
    HISTORY = map;
  } catch (e) { /* ignore */ }
}

async function load() {
  try {
    await loadHistory();
    const res = await fetch("data.json", { cache: "no-store" });
    const data = await res.json();
    document.getElementById("sub").textContent = data.any_error ? "⚠ some providers failed" : "all providers ok";
    render(data);
  } catch (e) {
    document.getElementById("sub").textContent = "⚠ cannot load data.json — run collect.sh first";
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
